name: Build and Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version_tag:
        description: 'Yayınlanacak Sürüm Etiketi (Örn: v1.0.0, v1.0.1)'
        required: true
        default: 'v1.0.0'
      is_prerelease:
        description: 'Ön Sürüm (Pre-release) olarak işaretlensin mi?'
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Restore Debug Keystore
        run: |
          if [ -f "debug.keystore.base64" ]; then
            base64 -d debug.keystore.base64 > debug.keystore
            echo "Debug keystore restored successfully."
          fi

      - name: Grant execute permission for gradlew
        run: |
          if [ -f "gradlew" ]; then
            chmod +x gradlew
          else
            gradle wrapper
            chmod +x gradlew
          fi

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Prepare APK for Release
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/20-20-20-Goz-Sagligi.apk

      - name: Upload APK as Artifact
        uses: actions/upload-artifact@v4
        with:
          name: 20-20-20-Goz-Sagligi-APK
          path: release-apk/20-20-20-Goz-Sagligi.apk

      - name: Determine Release Tag
        id: get_tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ github.event.inputs.version_tag }}"
            # If tag is empty or named main/master, fix it to v1.0.0
            if [ -z "$TAG" ] || [ "$TAG" = "main" ] || [ "$TAG" = "master" ]; then
              TAG="v1.0.0"
            fi
            echo "tag=$TAG" >> $GITHUB_OUTPUT
            echo "prerelease=${{ github.event.inputs.is_prerelease }}" >> $GITHUB_OUTPUT
          elif [[ "${{ github.ref }}" == refs/tags/* ]]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          else
            echo "tag=v1.0.0" >> $GITHUB_OUTPUT
            echo "prerelease=false" >> $GITHUB_OUTPUT
          fi

      - name: Create or Update GitHub Release with APK
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ steps.get_tag.outputs.tag }}
          name: 20-20-20 Göz Sağlığı ${{ steps.get_tag.outputs.tag }}
          draft: false
          prerelease: ${{ steps.get_tag.outputs.prerelease == 'true' }}
          files: release-apk/20-20-20-Goz-Sagligi.apk
          generate_release_notes: true
          body: |
            ## 🌿 20-20-20 Göz Sağlığı Mola Hatırlatıcısı

            Doğrudan Android telefonunuza kurabileceğiniz en güncel APK dosyası ektedir.

            ### 📲 Kurulum Adımları:
            1. Aşağıdaki **`20-20-20-Goz-Sagligi.apk`** dosyasına telefonunuzdan tıklayarak indirin.
            2. İndirme tamamlandığında dosyayı açın ve **Yükle** butonuna basın.
            3. "Bilinmeyen kaynaklardan yükleme" izni istenirse onay verin.
