name: Build and Release APK

on:
  push:
    branches: [ "main", "master" ]
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      - name: Rename APK for Download
        run: |
          mkdir -p release-apk
          cp app/build/outputs/apk/debug/app-debug.apk release-apk/20-20-20-Goz-Sagligi.apk

      - name: Upload APK as Artifact (Downloadable from GitHub Actions)
        uses: actions/upload-artifact@v4
        with:
          name: 20-20-20-Goz-Sagligi-APK
          path: release-apk/20-20-20-Goz-Sagligi.apk

      - name: Create GitHub Release with APK
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch'
        with:
          tag_name: ${{ github.ref_name || 'v1.0.0' }}
          name: 20-20-20 Göz Sağlığı Mola Hatırlatıcısı ${{ github.ref_name || 'v1.0.0' }}
          draft: false
          prerelease: false
          files: release-apk/20-20-20-Goz-Sagligi.apk
          body: |
            ## 🌿 20-20-20 Göz Sağlığı Mola Hatırlatıcısı
            
            Doğrudan Android telefonunuza kurabileceğiniz hazır APK dosyası ektedir.
            
            ### Kurulum:
            1. Aşağıdaki **`20-20-20-Goz-Sagligi.apk`** dosyasına telefonunuzdan dokunarak indirin.
            2. İndirme tamamlandığında dosyayı açın ve **Yükle** butonuna basın.
            3. "Bilinmeyen kaynaklardan yükleme" izni istenirse onay verin.
